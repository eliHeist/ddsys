{% load static ui %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
		name="robots"
		content="noindex" />
    <title>{{ title }} - {{ BRAND }}</title>
    <link rel="stylesheet" href="{% static 'index.css' %}">
    <link rel="icon" href="{% static 'favicon.svg' %}">
    {# sets the dark class before first paint; same "theme" key as <c-ui.mode_toggle> in the header #}
    <c-ui.mode_toggle.head />
	{% include "core/_scripts.html" %}
    <script defer src="{% static 'django_cotton_ui/cotton-ui.min.js' %}"></script>
    <script src="{% static 'index.js' %}" defer></script>
</head>
<body class="bg-bg text-fg antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
		hx-boost="true">
    {# every toast in the app: HX-Trigger {"toast": {"message", "variant"}} (apps.core.http.toast) or $dispatch('toast', {...}) #}
    <c-ui.toast.container position="bottom-right" />
    {{ slot }}
</body>
</html>
