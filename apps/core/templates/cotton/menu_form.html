{% comment %}
A menu row that POSTs, for use inside <c-ui.dropdown> (a <c-ui.dropdown.item> can only link or run JS):
    <c-menu-form action="{% url 'documents:generate' 'job_card' job.pk %}" target="_blank">Job card</c-menu-form>
    <c-menu-form action="{% url 'account_logout' %}" variant="danger">Sign out</c-menu-form>
Styled like the kit's dropdown item. HTMX boosting is off: these are real form posts (new tab, sign-out).
{% endcomment %}
<c-vars action="" target="" variant="" />

<form method="post" action="{{ action }}" {% if target %}target="{{ target }}"{% endif %} hx-boost="false" {{ attrs }}>
    {% csrf_token %}
    <button type="submit" role="menuitem"
        class="flex w-full cursor-pointer items-center gap-3 rounded-control px-4 py-2 text-left text-sm transition-colors focus-visible:outline-none
               {% if variant == 'danger' %}text-red-600 hover:bg-red-50 focus-visible:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/30
               {% else %}text-ink-700 hover:bg-ink-100 focus-visible:bg-ink-100 dark:text-ink-300 dark:hover:bg-ink-800{% endif %}">
        {{ slot }}
    </button>
</form>
