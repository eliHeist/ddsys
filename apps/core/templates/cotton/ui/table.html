<c-vars class="" />

{% comment %}
Project override of the kit's table: a SaaS-style list. Small muted headings on a tinted band, roomier rows,
and the first and last columns line up with <c-section>'s padding. Re-check against the kit's table.html
when upgrading django-cotton-ui.
{% endcomment %}
<div class="overflow-x-auto">
  <table {{ attrs }} class="w-full border-collapse text-left text-sm
    [&_th]:whitespace-nowrap [&_th]:bg-ink-50/80 [&_th]:px-3 [&_th]:py-2.5 [&_th]:text-xs [&_th]:font-medium [&_th]:text-muted dark:[&_th]:bg-white/[0.03]
    [&_td]:px-3 [&_td]:py-3 [&_td]:align-top [&_td]:text-ink-700 dark:[&_td]:text-ink-300
    [&_th:first-child]:pl-5 [&_td:first-child]:pl-5 [&_th:last-child]:pr-5 [&_td:last-child]:pr-5
    [&_thead]:border-b [&_thead]:border-box-border
    [&_tbody_tr]:border-b [&_tbody_tr]:border-box-border [&_tbody_tr:last-child]:border-0
    [&_tbody_tr]:transition-colors [&_tbody_tr:hover]:bg-ink-50/60 dark:[&_tbody_tr:hover]:bg-white/[0.03]
    [&_tfoot]:border-t [&_tfoot]:border-box-border [&_tfoot_td]:text-ink-900 dark:[&_tfoot_td]:text-ink-50
    {{ class }}">
    {{ slot }}
  </table>
</div>
