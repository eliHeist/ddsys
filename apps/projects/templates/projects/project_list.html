{% extends "base.html" %}
{% load ui %}
{% block title %}Projects{% endblock %}
{% block content %}
<c-page-header title="Projects">
  <c-ui.button variant="primary" size="sm" href="{% url 'projects:new' %}">{% icon "plus" %} New project</c-ui.button>
</c-page-header>
<c-list-toolbar target="project-rows" q="{{ q }}" status="{{ status }}" placeholder="Search project or client"
  :tabs="[('open', 'Open'), ('completed', 'Completed'), ('cancelled', 'Cancelled'), ('all', 'All')]" />
<c-section>{% include "projects/partials/_project_rows.html" %}</c-section>
{% endblock %}
