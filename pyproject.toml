    "django-extensions>=4.1",
    "django-htmx>=1.28.0",
    "django-ninja>=1.8.0",
    "django-simple-history>=3.10.1",
    "djangosetupheist>=0.6.3",
    "fpdf2>=2.8.7",
    "num2words>=0.5.14",
    "psycopg2-binary>=2.9.13",
    "uvicorn>=0.54.0",
    "whitenoise>=6.12.0",
