{% load i18n %}

<c-layout.base>
    <div class="grid place-content-center h-screen">
        <c-ui.card class="w-8/10 sm:min-w-md grid">
            <h2>{% trans "Password Reset Sent" %}</h2>
            <p class="text-slate-600">
                {% trans "We have sent you an email. If you have not received it, please check your spam folder. Otherwise contact us if you do not receive it in a few minutes." %}
            </p>

            <a href="{% url 'account_login' %}">
                <c-ui.button variant="primary">{% trans "Back to sign in" %}</c-ui.button>
            </a>
        </c-ui.card>
    </div>
</c-layout.base>
