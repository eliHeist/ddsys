{% load i18n %}

<c-layout.base>
    <div class="grid place-content-center h-screen">
        <c-ui.card class="w-8/10 sm:min-w-md grid">
            <h2>{% trans "Password Changed" %}</h2>
            <p class="text-slate-600">{% trans "Your password has been changed." %}</p>

            <a href="{% url 'account_login' %}">
                <c-ui.button variant="primary">{% trans "Sign in" %}</c-ui.button>
            </a>
        </c-ui.card>
    </div>
</c-layout.base>
